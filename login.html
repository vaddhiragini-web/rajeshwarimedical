<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Start Shopping</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="customer.css" />
</head>
<body>

<section class="auth-screen">
  <div class="auth-card">
    <div class="brand-mark">R</div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Enter your details to start ordering</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="cust-name">Your Name</label>
        <div class="input-wrap">
          <span class="icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="2"/><path d="M4 20c1.6-3.6 4.8-6 8-6s6.4 2.4 8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <input type="text" id="cust-name" placeholder="Enter your name" autocomplete="name" required />
        </div>
      </div>

      <div class="field">
        <label for="cust-phone">Mobile Number</label>
        <div class="input-wrap">
          <span class="phone-code">+91</span>
          <span class="icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </span>
          <input type="tel" id="cust-phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel-national" required />
        </div>
      </div>

      <p id="login-error" class="error-text" hidden></p>

      <button type="submit" class="btn btn-primary btn-block">
        Start Shopping
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <div class="auth-link-row">
      <a class="auth-link" href="admin-login.html">Admin Login</a>
    </div>
  </div>
</section>

<script src="customer.js"></script>
<script>
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("login-error");

  // If a customer session already exists, skip straight to the shop.
  if (getCustomerSession()) {
    window.location.href = "shop.html";
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    errorEl.hidden = true;

    const name = document.getElementById("cust-name").value.trim();
    const phoneDigits = document.getElementById("cust-phone").value.trim();

    if (!name) {
      errorEl.textContent = "Please enter your name.";
      errorEl.hidden = false;
      return;
    }
    if (!/^\d{10}$/.test(phoneDigits)) {
      errorEl.textContent = "Enter a valid 10-digit mobile number.";
      errorEl.hidden = false;
      return;
    }

    setCustomerSession({ name, phone: "+91" + phoneDigits });
    window.location.href = "shop.html";
  });
</script>
</body>
</html>
